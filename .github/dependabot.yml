version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/**"
    schedule:
      interval: weekly
      day: thursday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: thursday
    groups:
      dotnet:
        patterns:
          - "*"
